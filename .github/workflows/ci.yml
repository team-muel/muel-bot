name: CI

# No `paths:` filter on purpose: `typecheck` and `smoke tests` are required
# status checks on the default branch ruleset. A path filter would leave
# docs-only PRs without a check result and block them from merging.
on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    # Pin shared workflow semantics to an immutable organization commit.
    # Update this SHA only through an explicit reviewed bump PR.
    uses: team-muel/.github/.github/workflows/reusable-node-quality.yml@d53f1ff28f7934e7afc7844ccd7dd08dd78ca254
    with:
      node-version: '24'
      package-manager: npm
      install-command: npm ci
      test-command: npm run typecheck
      build-command: ''

  smoke:
    name: smoke tests
    # Keep both required jobs on the same immutable reusable-workflow revision.
    uses: team-muel/.github/.github/workflows/reusable-node-quality.yml@d53f1ff28f7934e7afc7844ccd7dd08dd78ca254
    with:
      node-version: '24'
      package-manager: npm
      install-command: npm ci
      # Smoke tests need no live API keys; the dummy token satisfies config validation.
      test-command: DISCORD_BOT_TOKEN=smoke-test-dummy npm run test:smoke
      build-command: ''
